<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة نود الشخصية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f0eb;
            color: #4a4238;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            margin: auto;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #d8c8b8;
            margin-bottom: 15px;
        }
        h1 {
            color: #3d3429;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #6b5e52;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #c5b39e;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #b09e88;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80" alt="NOOD DEV" class="profile-img">
        <h1>👋 مرحباً بكم في موقع نود!</h1>
        <p>أنا نود، مطورة ومصممة مواقع إلكترونية.</p>
        <a href="https://github.com/Nood2281993" class="btn" target="_blank">زيارة حسابي على GitHub</a>
    </div>

</body>
</html>
