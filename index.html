<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفق DEV | مطورة ويب ومصممة واجهات</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            border: 3px solid #38bdf8;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            color: #f8fafc;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background-color: #38bdf8;
            color: #0f172a;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #0284c7;
            color: #ffffff;
        }
        .btn-secondary {
            background-color: #334155;
            color: #f8fafc;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="logo.png" alt="أفق DEV" class="avatar">
        <h1>أفق DEV</h1>
        <p>مطورة ومصممة واجهات موقع متخصصة في بناء مواقع إلكترونية عصرية ومجهزة للعملاء.</p>
        
        <a href="cafe.html" class="btn" target="_blank">معاينة مشروع الكافيه ☕</a>
        <a href="mailto:Nood1000n@gmail.com" class="btn btn-secondary">تواصل معي للأعمال ✉️</a>

        <footer>
            <p>© 2026 أفق DEV. جميع الحقوق محفوظة.</p>
        </footer>
    </div>

</body>
</html>
