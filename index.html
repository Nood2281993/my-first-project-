<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة نود الشخصية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>مرحباً بكم في موقع نود! 👋</h1>
        <p>أنا مطورة مواقع متدربة، وأعمل حالياً على إتقان مهارات بناء وتنسيق المواقع الإلكترونية.</p>
        <a href="https://github.com/Nood2281993" class="btn">زيارة حسابي على GitHub</a>
    </div>

</body>
</html>
