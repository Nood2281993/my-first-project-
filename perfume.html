<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر عطور أفق | Ofoq Perfumes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            text-align: center;
        }
        header {
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid #334155;
        }
        h1 {
            color: #fbbf24;
            font-size: 28px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card-title {
            color: #f3f4f6;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .card-desc {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .price {
            color: #38bdf8;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 متجر عطور أفق</h1>
        <p class="subtitle">تشكيلة فاخرة من العطور الشرقية والغربية</p>
    </header>

    <div class="grid">
        <div class="card">
            <h2 class="card-title">عطر أفق الذهبي 👑</h2>
            <p class="card-desc">مزبيج من العود والمسك الأبيض مع لمسات من أزهار الياسمين الفاخرة.</p>
            <div class="price">350 ر.س</div>
            <button class="btn">إضافة للسلّة 🛒</button>
        </div>

        <div class="card">
            <h2 class="card-title">عطر أفق الليلي 🌙</h2>
            <p class="card-desc">عطر دافئ وجذاب يتكون من الفانيلا النادرة وخشب الصندل الرفيع.</p>
            <div class="price">290 ر.س</div>
            <button class="btn">إضافة للسلّة 🛒</button>
        </div>
    </div>

</body>
</html>
