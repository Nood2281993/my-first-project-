<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BugBounty Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Styles & Dark Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        /* Top Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid #1e2638;
            background-color: #121721;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .back-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Main Container */
        .dashboard-container {
            padding: 30px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        /* Stat Card */
        .stat-card {
            background-color: #121721;
            border: 1px solid #1e2638;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: #2e3b54;
        }

        /* Card Icons */
        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .rank-icon { background-color: rgba(147, 51, 234, 0.2); color: #a855f7; }
        .points-icon { background-color: rgba(234, 179, 8, 0.2); color: #eab308; }
        .highest-bounty-icon { background-color: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .total-bounties-icon { background-color: rgba(59, 130, 246, 0.2); color: #3b82f6; }

        /* Card Content */
        .card-title {
            font-size: 13px;
            color: #94a3b8;
            display: block;
        }

        .card-value {
            font-size: 22px;
            font-weight: 700;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <!-- Header / Top Bar -->
    <header class="dashboard-header">
        <div class="header-left">
            <a href="index.html" class="back-link">← العودة للرئيسية (أُفق)</a>
            <h1 class="page-title">BugBounty Dashboard</h1>
        </div>
        <div class="header-right">
            <span style="cursor: pointer;">🔔</span>
            <div style="cursor: pointer;">👤</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-container">
        
        <!-- Cards Grid -->
        <section class="stats-grid">
            
            <!-- Card 1: Rank -->
            <div class="stat-card">
                <div class="card-icon rank-icon">🏆</div>
                <div class="card-info">
                    <span class="card-title">Rank</span>
                    <h2 class="card-value">0th</h2>
                </div>
            </div>

            <!-- Card 2: Total Points -->
            <div class="stat-card">
                <div class="card-icon points-icon">✨</div>
                <div class="card-info">
                    <span class="card-title">Total Points</span>
                    <h2 class="card-value">0</h2>
                </div>
            </div>

            <!-- Card 3: Highest Bounty -->
            <div class="stat-card">
                <div class="card-icon highest-bounty-icon">⤒</div>
                <div class="card-info">
                    <span class="card-title">Highest Bounty</span>
                    <h2 class="card-value">⌖ 0</h2>
                </div>
            </div>

            <!-- Card 4: Total Bounties -->
            <div class="stat-card">
                <div class="card-icon total-bounties-icon">💰</div>
                <div class="card-info">
                    <span class="card-title">Total Bounties</span>
                    <h2 class="card-value">⌖ 0</h2>
                </div>
            </div>

        </section>

    </main>

</body>
</html>
